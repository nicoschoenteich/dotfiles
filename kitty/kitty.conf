enabled_layouts fat:bias=70;full_size=1;mirrored=false

map cmd+up resize_window taller
map cmd+down resize_window shorter
map cmd+shift+enter close_window
map cmd+1 next_window

## font_family 72Mono-Regular

modify_font cell_height 2px
font_size 13.0

shell_integration disabled

macos_titlebar_color background

# window_logo_path background.png
window_logo_position bottom-right
window_logo_alpha 1
window_logo_scale 100

# Nightfox colors for Kitty
## name: jouleworkdarkfox
## upstream: https://github.com/edeneast/nightfox.nvim/raw/main/extra/jouleworkdarkfox/kitty.conf

background #171A20
foreground #F1F2F4
selection_background #2914A6
selection_foreground #F1F2F4
cursor_text_color #171A20
url_color #f1f2f4

# Cursor
# uncomment for reverse background
# cursor none
cursor #F1F2F4

# Border
active_border_color #8080f7
inactive_border_color #3055B0
bell_border_color #b396f8

# Tabs
active_tab_background #8080f7
active_tab_foreground #0B0C0E
inactive_tab_background #2914A6
inactive_tab_foreground #7E879A

# normal
color0 #2914a6
color1 #cc44dd
color2 #f1f2f4
color3 #8080f7
color4 #8080f7
color5 #68aff9
color6 #8080f7
color7 #f1f2f4

# bright
color8 #4937b3
